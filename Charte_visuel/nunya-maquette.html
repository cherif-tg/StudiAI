<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nunya — maquette interactive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23EFEAE1'/%3E%3Cg transform='translate(8 8) scale(.75)' fill='none' stroke-width='4' stroke-linecap='round'%3E%3Cpath d='M32 54V28' stroke='%235C6B4F'/%3E%3Cpath d='M32 28C12 28 12 6 29 4' stroke='%235C6B4F'/%3E%3Cpath d='M32 32C52 32 52 12 37 8' stroke='%23A6472E'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#EFEAE1;--panel:#FBF9F4;--side:#F6F2E9;--line:#D6CDBB;--ink:#1B2A2E;--muted:#6B6456;
--green:#5C6B4F;--on:#FBF8F3;--gs:#E6EAE1;
--ochre:#8A6B2E;--os:#F3ECD9;
--red:#8C3A3A;--rs:#F3E2DF;--warn:#8A6B2E;
--accent:#A6472E;--as:#F3E2DB;
--info:#2B4357;--is:#E3E8EC;
--b1:rgba(166,71,46,.12);--b2:rgba(43,67,87,.12);
--sh:0 1px 2px rgba(27,42,46,.05),0 12px 32px rgba(27,42,46,.07);--r:22px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121A19;--panel:#1F2C2A;--side:#1A2523;--line:#35392F;--ink:#EDE7D9;--muted:#A79F8C;
--green:#8FA37E;--on:#15211F;--gs:#27352A;
--ochre:#D9B15E;--os:#3A3120;
--red:#D98A85;--rs:#3B2626;--warn:#D9B15E;
--accent:#D98562;--as:#3A2820;
--info:#7C9CB4;--is:#22303A;
--b1:rgba(217,133,98,.10);--b2:rgba(124,156,180,.10);
--sh:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.28);}}
:root[data-theme="dark"]{--bg:#121A19;--panel:#1F2C2A;--side:#1A2523;--line:#35392F;--ink:#EDE7D9;--muted:#A79F8C;
--green:#8FA37E;--on:#15211F;--gs:#27352A;
--ochre:#D9B15E;--os:#3A3120;
--red:#D98A85;--rs:#3B2626;--warn:#D9B15E;
--accent:#D98562;--as:#3A2820;
--info:#7C9CB4;--is:#22303A;
--b1:rgba(217,133,98,.10);--b2:rgba(124,156,180,.10);
--sh:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.28);}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font:14px/1.5 "Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
background:radial-gradient(60rem 40rem at 8% -10%,var(--b1),transparent 60%),radial-gradient(50rem 40rem at 100% 110%,var(--b2),transparent 60%),var(--bg);background-attachment:fixed;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:background-color .4s,color .4s}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.canvas{max-width:1320px;margin:0 auto;padding:clamp(10px,2vw,24px)}
.frame{display:flex;flex-direction:column;gap:14px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:18px 0 0}

/* barre du haut */
.top{display:flex;align-items:center;gap:14px;padding:4px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:23px}
.sp{flex:1}
.tabs,.seg{display:flex;gap:2px;padding:4px;background:var(--panel);border-radius:999px;box-shadow:var(--sh)}
.tabs button,.seg button{background:none;border:0;border-radius:999px;padding:6px 15px;color:var(--muted);transition:background-color .25s,color .25s}
.tabs .on,.seg .on{background:var(--as);color:var(--accent);font-weight:600}
.ico{width:38px;height:38px;border-radius:50%;border:0;background:var(--panel);box-shadow:var(--sh);display:grid;place-items:center;color:var(--ink);transition:transform .25s}
.ico:hover{transform:rotate(14deg)}
.av{width:36px;height:36px;border-radius:50%;background:var(--as);color:var(--accent);display:grid;place-items:center;font-weight:600}

/* trois zones fluides */
.cols{display:grid;grid-template-columns:minmax(210px,.8fr) minmax(0,1.7fr) minmax(290px,1.05fr);gap:14px;height:clamp(540px,calc(100vh - 120px),760px)}
.cols>section{display:flex;flex-direction:column;min-height:0;border-radius:var(--r)}
.src,.atl{background:var(--panel);box-shadow:var(--sh)}
.src{background:var(--side)}
.mid{background:color-mix(in srgb,var(--panel) 55%,transparent)}
.hd{padding:16px 18px 8px;display:flex;align-items:center;justify-content:space-between;font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:17px}
.btn{font-size:13px;padding:7px 14px;border-radius:999px;border:0;background:var(--is);color:var(--info);font-weight:500;transition:transform .2s,background-color .2s}
.btn:hover{transform:translateY(-1px)}
.btn.p{background:var(--accent);color:var(--on)}
.docs{overflow:auto;padding:0 8px}
.doc{display:flex;gap:10px;padding:10px 12px;width:100%;text-align:left;background:none;border:0;border-radius:14px;transition:background-color .2s}
.doc:hover{background:var(--panel)}
.doc i{width:12px;height:12px;margin-top:5px;border-radius:50%;background:var(--green);flex:none}
.doc i.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.doc small{display:block;color:var(--muted);font-size:12px}
.ok{color:var(--green)}.wait{color:var(--warn)}
.empty{color:var(--muted);font-size:13px;padding:6px 12px;margin:0}
.note{margin-top:auto;padding:14px 18px;font-size:12px;color:var(--muted)}

/* discussion */
.msgs{flex:1;overflow:auto;padding:8px 22px;display:flex;flex-direction:column;gap:14px}
.me{align-self:flex-end;max-width:72%;background:var(--gs);padding:10px 15px;border-radius:18px 18px 4px 18px}
.ag{max-width:92%;background:var(--panel);box-shadow:var(--sh);padding:12px 16px;border-radius:18px 18px 18px 4px}
.ag p{margin:0 0 8px}
.cite{font-size:11px;font-weight:600;color:var(--info);background:var(--is);border-radius:6px;padding:0 6px}
.refs{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12.5px;padding:5px 12px;border:0;border-radius:999px;background:var(--as);color:var(--accent);transition:transform .2s}
.chip:hover{transform:translateY(-1px)}
.comp{margin:6px 18px 18px;display:flex;gap:8px;padding:6px;background:var(--panel);border-radius:999px;box-shadow:var(--sh)}
.comp input{flex:1;font:inherit;padding:8px 14px;border:0;background:none;color:var(--ink)}
.comp input:focus-visible{outline:none}

/* atelier */
.tools{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.tool{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 12px 5px 8px;border:0;border-radius:999px;background:var(--side);transition:box-shadow .25s,background-color .25s}
.tool:hover{background:var(--is)}
.tool.on{background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--tc);font-weight:600}
.shp{flex:none;display:block}
.body{flex:1;min-height:0;overflow:auto;padding:0 16px}
.sheet{background:var(--side);border-radius:18px;padding:16px 18px;font-family:"Fraunces",Georgia,serif;margin-top:8px;animation:rise .35s ease both}
.sh{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.sheet h3{margin:0;font-size:18px;line-height:1.25}
.sheet .m{font:12px "Work Sans",system-ui,sans-serif;color:var(--muted)}
.sheet p{margin:0 0 8px;font-size:14px;line-height:1.55}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two h4{margin:0 0 6px;font:600 12px "Work Sans",system-ui,sans-serif;color:var(--info)}
.sk{height:8px;border-radius:4px;background:var(--line);margin:0 0 9px}
.warn{margin-top:8px;font:12px "Work Sans",system-ui,sans-serif;color:var(--warn);background:var(--os);padding:7px 11px;border-radius:10px}
.act{display:flex;gap:8px;padding:12px 16px 16px;flex-wrap:wrap}
.sg{font-size:12px;color:var(--muted);margin:2px 0 0}
.opt{display:block;width:100%;text-align:left;padding:9px 13px;margin:6px 0;border:0;border-radius:12px;background:var(--panel);font-family:"Work Sans",system-ui,sans-serif;transition:transform .2s}
.opt:hover{transform:translateX(2px)}
.opt.good{box-shadow:inset 0 0 0 1.5px var(--green);background:var(--gs)}
.opt.bad{box-shadow:inset 0 0 0 1.5px var(--red);background:var(--rs)}

/* carnet */
.intro{padding:4px 8px 0}
.intro h2{font-family:"Fraunces",Georgia,serif;font-size:clamp(24px,4vw,32px);margin:0}
.intro p{margin:2px 0 0;color:var(--muted)}
.carnet{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.pane{background:var(--panel);box-shadow:var(--sh);border-radius:var(--r);padding:0 20px 20px;animation:rise .4s ease both}
.pane .hd{padding:16px 0 8px}
.pane h3{margin:18px 0 8px;font-family:"Fraunces",Georgia,serif;font-size:15px}
.n{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0}
.bar{grid-column:1/3;height:7px;background:var(--line);border-radius:4px}
.bar u{display:block;height:100%;border-radius:4px}
.st{font-size:12px;font-weight:600}.g{color:var(--green)}.o{color:var(--warn)}.r{color:var(--red)}
.rev{background:var(--rs);border-radius:16px;padding:13px 15px}
.rev b{display:block}.rev span{font-size:12px;color:var(--muted)}
.art{display:flex;gap:12px;align-items:center;padding:10px 12px;margin-bottom:8px;border-radius:16px;background:var(--side)}
.art b{display:block;font-weight:500}
.art small{color:var(--muted)}

/* accueil */
.welcome{max-width:680px;margin:clamp(6px,4vh,44px) auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;animation:rise .5s ease both}
.hero h1{font:600 clamp(42px,8vw,66px)/1 "Fraunces",Georgia,serif;margin:.5rem 0 0}
.tag{font-family:"Fraunces",Georgia,serif;font-style:italic;color:var(--muted);font-size:18px;margin:4px 0 0}
.intro-t{color:var(--muted);max-width:52ch;margin:0}
.ewe{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);padding:18px 26px;width:100%}
.glyphs{font-family:"Fraunces",Georgia,serif;font-size:clamp(22px,5vw,34px);letter-spacing:.04em}
.ewe .cap{font-size:12px;color:var(--muted);margin-top:4px}
.sess{width:100%;text-align:left}
.srow{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:0;border-radius:18px;padding:14px 18px;box-shadow:var(--sh);margin-top:8px;text-align:left;transition:transform .2s}
.srow:hover{transform:translateY(-2px)}
.srow small{display:block;color:var(--muted)}
.srow .go{color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap}
.srow.busy{opacity:.6;pointer-events:none}
.newrow{display:flex;justify-content:center;margin-top:12px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:980px){.cols{grid-template-columns:1fr;height:auto}.cols>section{max-height:none}.msgs{max-height:420px}.docs{max-height:220px}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="canvas"><div class="frame" id="app"></div><p class="foot">Maquette interactive. Aucun modèle derrière : les réponses sont des exemples.</p></div>
<input type="file" id="up" multiple hidden accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png">
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const QZ=[["Où se déroule la phase claire ?",["Dans les thylakoïdes","Dans le stroma","Dans la mitochondrie"]],["Quel produit de la phase claire alimente le cycle de Calvin ?",["L'ATP","Le glucose","Le dioxygène"]],["Que devient la photosynthèse sans lumière ?",["Elle s'accélère","Elle ralentit puis s'arrête","Elle reste identique"]]];
const ANS=[0,0,1];
const DS=[["Photosynthèse selon la lumière",[10,35,60,80,85],["0","25","50","75","100"]],["Activité au cours de la journée",[20,75,90,30,0],["6 h","10 h","14 h","18 h","22 h"]]];
const TC={fiche:'var(--accent)',resume:'var(--info)',quiz:'var(--green)',graphique:'var(--ochre)',export:'var(--muted)'};
const TL={fiche:'Fiche',resume:'Résumé',quiz:'Quiz',graphique:'Graphique',export:'Export'};
const TOOLS=[['resume','Résumé'],['quiz','Quiz'],['graphique','Graphique'],['fiche','Fiche bilingue'],['export','Export']];
const SESS=[["SVT — La photosynthèse","3 sources · 29 sept."],["Histoire — Chapitre 2","2 sources · 24 sept."]];
const SUN=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>`;
const MOON=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>`;

const S={view:'accueil',loading:0,tool:'fiche',lang:'Français',sum:0,ds:0,qi:0,qa:null,qs:0,done:0,scores:[55,60,72,80],docs:[],msgs:[],arts:[]};
const demoDocs=()=>[{n:'Chapitre 3 – Photosynthèse.pdf',m:'24 pages',on:1,st:1},{n:'Fiche respiration.docx',m:'3 pages',on:1,st:1},{n:'Cours SVT (photo).jpg',m:'',on:0,st:0}];
const demoArts=()=>[{t:'fiche',n:'Fiche de révision, bilingue',d:'PDF, 28 sept.'},{t:'resume',n:'Résumé du chapitre 3',d:'28 sept.'},{t:'quiz',n:'Quiz sur la photosynthèse',d:'29 sept.'},{t:'graphique',n:'Effet de la lumière',d:'29 sept.'}];
const demoMsgs=()=>[{r:'me',t:"Pourquoi la photosynthèse s'arrête-t-elle la nuit ?"},{r:'ag',t:"Sans lumière, la phase claire ne produit plus l'ATP ni le NADPH dont le cycle de Calvin a besoin. Il ralentit alors, puis s'arrête <span class=cite>1</span>. La plante continue de respirer <span class=cite>2</span>.",refs:["Chapitre 3 – Photosynthèse.pdf, p. 14","Fiche respiration.docx, p. 2"],chips:["Fais-moi un quiz","Résume le chapitre","Trace un graphique"]}];

const effTheme=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),2200)};
const chip=(a,v,t)=>`<button class="chip" data-a="${a}" data-v="${E(v)}">${E(t)}</button>`;

function mark(s){return`<svg viewBox="0 0 64 64" width="${s}" height="${s}" fill="none" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M32 54V28" stroke="var(--green)"/><path d="M32 28C12 28 12 6 29 4" stroke="var(--green)"/><path d="M32 32C52 32 52 12 37 8" stroke="var(--accent)"/></svg>`}
function shape(t,s){s=s||22;const c=TC[t],a=`fill="${c}" stroke="${c}" stroke-width="1.5" stroke-linejoin="round"`,w='stroke="var(--on)" stroke-width="1.8" stroke-linecap="round" fill="none"';let g='';
if(t=='fiche')g=`<rect x="3.5" y="2.5" width="17" height="19" rx="5" ${a}/><path d="M8 9h8M8 13h8M8 17h4" ${w}/>`;
else if(t=='resume')g=`<circle cx="12" cy="12" r="10" ${a}/><path d="M7.5 9.5h9M7.5 13h9M7.5 16.5h5" ${w}/>`;
else if(t=='quiz')g=`<path d="M12 2 22 12 12 22 2 12Z" ${a}/><path d="M9.8 10.2a2.3 2.3 0 1 1 3.3 2c-.7.4-1.1.8-1.1 1.6" ${w}/><circle cx="12" cy="16.3" r=".9" fill="var(--on)"/>`;
else if(t=='graphique')g=`<path d="M12 2l8.7 5v10L12 22l-8.7-5V7Z" ${a}/><path d="M8.5 16v-3M12 16V9M15.5 16v-5" ${w}/>`;
else g=`<path d="M5 2.5h9.5L19 7v14.5H5Z" ${a}/><path d="M12 9.5v7M9 14l3 3 3-3" ${w}/>`;
return`<svg class="shp" viewBox="0 0 24 24" width="${s}" height="${s}" aria-hidden="true">${g}</svg>`}
const sh=(t,title,meta)=>`<div class="sh">${shape(t,28)}<div><h3>${title}</h3><div class="m">${meta}</div></div></div>`;

function bars(v,l){const w=330/v.length,bw=Math.min(40,w-24);let s='<svg viewBox="0 0 330 200" width="100%" role="img" aria-label="Graphique en barres"><g stroke="var(--line)"><line x1="6" x2="324" y1="20" y2="20"/><line x1="6" x2="324" y1="90" y2="90"/><line x1="6" x2="324" y1="160" y2="160"/></g>';v.forEach((x,i)=>{const h=x*1.4,cx=w*i+w/2;s+=`<rect x="${cx-bw/2}" y="${160-h}" width="${bw}" height="${h}" rx="6" fill="var(--ochre)"/><text x="${cx}" y="${154-h}" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)">${x}</text><text x="${cx}" y="178" font-size="11" text-anchor="middle" fill="var(--muted)">${l[i]}</text>`});return s+'</svg>'}

function topbar(){const dark=effTheme()=='dark',ses=S.view!='accueil',lab=dark?'Passer en mode clair':'Passer en mode sombre';
return`<div class="top"><button class="brand" data-a="home" aria-label="Retour à l'accueil">${mark(30)}<span>Nunya</span></button>${ses?`<div class="tabs">${['atelier','carnet'].map(v=>`<button data-a="view" data-v="${v}" class="${S.view==v?'on':''}">${v=='atelier'?'Atelier':'Carnet'}</button>`).join('')}</div>`:''}<div class="sp"></div>${ses?`<div class="seg">${['Français','Éwé','Kabiyè'].map(l=>`<button data-a="lang" data-v="${l}" class="${S.lang==l?'on':''}">${l}</button>`).join('')}</div>`:''}<button class="ico" data-a="theme" aria-label="${lab}" title="${lab}">${dark?SUN:MOON}</button>${ses?'<div class="av">K</div>':''}</div>`}

function accueil(){return`<div class="welcome"><div class="hero">${mark(76)}<h1>Nunya</h1><p class="tag">Apprendre commence par comprendre.</p></div><p class="intro-t">Dépose tes documents et pose tes questions : Nunya les transforme en résumés, quiz et fiches de révision, en français, en éwé ou en kabiyè.</p><div class="ewe"><div class="glyphs" lang="ee">Ɖɖ Ƒƒ Ɣɣ Ŋŋ Ɔɔ Ʋʋ Ɛɛ</div><div class="cap">Alphabet éwé : tous les caractères s'affichent correctement.</div></div><div class="sess"><div class="sg">Reprendre une session</div>${SESS.map((s,i)=>`<button class="srow ${S.loading?'busy':''}" data-a="load" data-v="demo"><span>${s[0]}<small>${s[1]}</small></span><span class="go">${S.loading=='demo'&&i==0?'Chargement…':'Ouvrir'}</span></button>`).join('')}<div class="newrow"><button class="btn p" data-a="load" data-v="new">${S.loading=='new'?'Création…':'Nouvelle session'}</button></div></div></div>`}

function sources(){return`<section class="src"><div class="hd">Sources <button class="btn" data-a="add">Ajouter</button></div><div class="docs">${S.docs.length?S.docs.map((d,i)=>`<button class="doc" data-a="doc" data-v="${i}"><i class="${d.on?'':'off'}"></i><div>${E(d.n)}<small>${d.st?`<span class=ok>Indexé</span>${d.m?', '+d.m:''}`:'<span class=wait>Lecture du texte en cours</span>'}</small></div></button>`).join(''):`<p class="empty">Aucun document pour l'instant. Ajoute un PDF, un Word ou une photo de cours.</p>`}</div><div class="note">Vos documents restent privés et ne sont visibles que dans votre session.</div></section>`}

function chat(){return`<section class="mid"><div class="hd">Discussion</div><div class="msgs" id="msgs">${S.msgs.length?S.msgs.map(m=>m.r=='me'?`<div class="me">${E(m.t)}</div>`:`<div class="ag"><p>${m.t}</p>${m.refs?`<div class="refs">${m.refs.map((r,i)=>`${i+1}. ${r}<br>`).join('')}</div>`:''}${m.chips?`<div class="chips">${m.chips.map(c=>chip('ask',c,c)).join('')}</div>`:''}</div>`).join(''):`<div class="ag"><p>Bonjour, je suis Nunya. Ajoute un document puis pose-moi une question.</p></div>`}</div><div class="comp"><input id="q" placeholder="Posez une question sur vos sources" aria-label="Votre question"><button class="btn p" data-a="send">Envoyer</button></div></section>`}

function panel(){const t=S.tool;
if(t=='resume')return`<p class="sg">Suggestions</p><div class="chips">${chip('sum',0,'Résumé court')}${chip('sum',1,'Résumé détaillé')}</div><div class="sheet">${sh('resume','Résumé du chapitre 3',S.sum?'Version détaillée':'Version courte')}<p>La photosynthèse convertit l'énergie lumineuse en énergie chimique dans les chloroplastes.</p>${S.sum?`<p>La phase claire, dans les thylakoïdes, produit l'ATP et le NADPH. Le cycle de Calvin, dans le stroma, les utilise pour fabriquer des sucres. Sans lumière, la phase claire s'arrête et le cycle ralentit.</p>`:''}</div>`;
if(t=='quiz'){if(S.done)return`<div class="sheet">${sh('quiz','Quiz terminé','Score : '+S.qs+' sur '+QZ.length)}<p>Ce résultat est ajouté au Carnet.</p></div><div class="chips" style="margin-top:10px">${chip('quizgo',0,'Rejouer')}${chip('view','carnet','Voir le Carnet')}</div>`;const q=QZ[S.qi];return`<div class="sheet">${sh('quiz',q[0],'Question '+(S.qi+1)+' sur '+QZ.length)}${q[1].map((o,i)=>`<button class="opt ${S.qa==null?'':i==ANS[S.qi]?'good':i==S.qa?'bad':''}" data-a="opt" data-v="${i}">${o}</button>`).join('')}${S.qa!=null?`<div class="warn">${S.qa==ANS[S.qi]?'Bonne réponse.':'Réponse incorrecte.'} Voir le passage du cours, p. 14.</div>`:''}</div>${S.qa!=null?`<div class="chips" style="margin-top:10px">${chip('next',0,S.qi<QZ.length-1?'Question suivante':'Voir le résultat')}</div>`:''}`}
if(t=='graphique')return`<p class="sg">Suggestions</p><div class="chips">${chip('ds',0,'Effet de la lumière')}${chip('ds',1,'Activité sur 24 h')}</div><div class="sheet">${sh('graphique',DS[S.ds][0],'Données du chapitre 3')}${bars(DS[S.ds][1],DS[S.ds][2])}</div>`;
if(t=='export')return`<p class="sg">Suggestions</p><div class="chips">${chip('exp','PDF','Fiche en PDF')}${chip('exp','Word','Fiche en Word')}${chip('exp','Bilingue','Version bilingue')}</div><div class="sheet">${sh('export','Exporter','Choisir un format')}<p>Le fichier reprend le contenu de la fiche et renvoie aux passages sources.</p></div>`;
return`<p class="sg">Suggestions</p><div class="chips">${chip('ask','Ajoute un schéma','Ajouter un schéma')}${chip('ask','Simplifie la fiche','Simplifier')}</div><div class="sheet">${sh('fiche','La photosynthèse','Fiche de révision, chapitre 3')}<div class="two"><div><h4>Français</h4><p>La photosynthèse transforme l'énergie lumineuse en énergie chimique, en deux phases : la phase claire et le cycle de Calvin.</p></div><div><h4>${S.lang=='Français'?'Éwé':S.lang}</h4><div class="sk" style="width:96%"></div><div class="sk" style="width:88%"></div><div class="sk" style="width:92%"></div><div class="sk" style="width:60%"></div></div></div><div class="warn">Traduction générée automatiquement, à relire avant usage.</div></div>`}

function atelier(){return`<section class="atl"><div class="hd">Atelier</div><div class="tools">${TOOLS.map(x=>`<button class="tool ${S.tool==x[0]?'on':''}" style="--tc:${TC[x[0]]}" data-a="tool" data-v="${x[0]}">${shape(x[0],18)}<span>${x[1]}</span></button>`).join('')}</div><div class="body">${panel()}</div><div class="act"><button class="btn p" data-a="exp" data-v="PDF">Télécharger en PDF</button><button class="btn" data-a="art">Ajouter au Carnet</button></div></section>`}

function carnet(){return`<div class="intro"><h2>Mon Nunyati</h2><p>Ce que j'ai fait grandir.</p></div><div class="carnet"><section class="pane"><div class="hd">Notions</div>${[['Phase claire','Maîtrisée','g',90,'var(--green)'],['Cycle de Calvin','En cours','o',60,'var(--ochre)'],['Respiration cellulaire','À revoir','r',30,'var(--red)']].map(n=>`<div class="n"><span>${n[0]}</span><span class="st ${n[2]}">${n[1]}</span><div class="bar"><u style="width:${n[3]}%;background:${n[4]}"></u></div></div>`).join('')}</section><section class="pane"><div class="hd">Résultats des quiz</div>${bars(S.scores.slice(-5),S.scores.slice(-5).map((_,i,a)=>'Quiz '+(S.scores.length-a.length+i+1)))}</section><section class="pane"><div class="hd">À réviser aujourd'hui</div><div class="rev"><b>Respiration cellulaire</b><span>3 erreurs au dernier quiz</span><div style="margin-top:9px"><button class="btn p" data-a="quizgo">Lancer un quiz court</button></div></div><h3>Artefacts</h3>${S.arts.length?S.arts.map(a=>`<div class="art">${shape(a.t,34)}<div><b>${E(a.n)}</b><small>${TL[a.t]} · ${E(a.d)}</small></div></div>`).join(''):`<p class="empty" style="padding:0">Aucun artefact pour l'instant.</p>`}</section></div>`}

function render(){const v=S.view;$("#app").innerHTML=topbar()+(v=='accueil'?accueil():v=='atelier'?`<div class="cols">${sources()}${chat()}${atelier()}</div>`:carnet());const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}

function reply(t){const s=t.toLowerCase(),r={t:"Ceci est une maquette : aucun modèle ne répond ici. Voici ce que l'agent proposerait.",chips:["Résume le chapitre","Fais-moi un quiz","Trace un graphique"]};
if(/quiz|question|teste/.test(s)){S.tool='quiz';S.qi=0;S.qa=null;S.qs=0;S.done=0;r.t="J'ouvre le Quiz dans l'Atelier. Chaque correction renvoie au passage du cours.";r.chips=["Résume le chapitre"]}
else if(/r[ée]sum/.test(s)){S.tool='resume';r.t="Le résumé est prêt dans l'Atelier, en version courte ou détaillée.";r.chips=["Fais-moi un quiz"]}
else if(/graph|courbe|sch[ée]ma/.test(s)){S.tool='graphique';r.t="Graphique généré dans l'Atelier à partir des données du chapitre.";r.chips=["Fais-moi un quiz"]}
else if(/fiche|traduc|[ée]w[ée]|kabiy/.test(s)){S.tool='fiche';r.t="La fiche bilingue est dans l'Atelier. La traduction est à relire par un locuteur natif.";r.chips=["Exporte en PDF"]}
else if(/calvin|nuit|lumi|atp/.test(s)){r.t="Le cycle de Calvin dépend de l'ATP produit par la phase claire <span class=cite>1</span>.";r.refs=["Chapitre 3 – Photosynthèse.pdf, p. 14"]}
return r}
function send(t){t=(t||'').trim();if(!t)return;S.msgs.push({r:'me',t});render();setTimeout(()=>{S.msgs.push(Object.assign({r:'ag'},reply(t)));render();const q=$('#q');q&&q.focus()},600)}
const artName=()=>({fiche:'Fiche de révision, '+S.lang,resume:'Résumé du chapitre 3',quiz:'Quiz sur la photosynthèse',graphique:DS[S.ds][0],export:'Export PDF de la fiche'})[S.tool];

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a=='home'){S.view='accueil';S.loading=0}
else if(a=='theme'){document.documentElement.dataset.theme=effTheme()=='dark'?'light':'dark'}
else if(a=='load'){if(S.loading)return;S.loading=v;render();setTimeout(()=>{if(v=='new'){S.docs=[];S.msgs=[];S.arts=[]}else{S.docs=demoDocs();S.msgs=demoMsgs();S.arts=demoArts();setTimeout(()=>{const d=S.docs[2];if(d&&!d.st){d.st=1;d.on=1;render()}},2500)}S.tool='fiche';S.loading=0;S.view='atelier';render()},800);return}
else if(a=='view'){S.view=v}else if(a=='tool'){S.tool=v}else if(a=='lang'){S.lang=v}
else if(a=='add'){$('#up').click();return}
else if(a=='doc'){const d=S.docs[v];if(d)d.on=d.st?!d.on:0}
else if(a=='ask'){send(v);return}
else if(a=='send'){const q=$('#q');send(q.value);return}
else if(a=='sum'){S.sum=+v}else if(a=='ds'){S.ds=+v}
else if(a=='opt'){if(S.qa!=null)return;S.qa=+v;if(+v==ANS[S.qi])S.qs++}
else if(a=='next'){if(S.qi<QZ.length-1){S.qi++;S.qa=null}else{S.done=1;S.scores.push(Math.round(S.qs/QZ.length*100))}}
else if(a=='quizgo'){S.view='atelier';S.tool='quiz';S.qi=0;S.qa=null;S.qs=0;S.done=0}
else if(a=='exp'){toast('Export '+v+' simulé : la maquette ne génère pas de fichier.');return}
else if(a=='art'){S.arts.unshift({t:S.tool,n:artName(),d:'6 oct.'});toast('Ajouté au Carnet : '+TL[S.tool]+'.');return}
render()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='q'){send(e.target.value)}});
$('#up').addEventListener('change',e=>{[...e.target.files].forEach(f=>{const d={n:f.name,m:Math.max(1,Math.round(f.size/1024))+' Ko',on:0,st:0};S.docs.push(d);setTimeout(()=>{d.st=1;d.on=1;render()},1800)});e.target.value='';toast('Document reçu, indexation en cours.');render()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!document.documentElement.dataset.theme)render()});
render();
</script>
</body>
</html>
