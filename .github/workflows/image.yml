name: Image API

# Construit l'image Docker de l'API et la publie sur GHCR (GitHub Container
# Registry). Le Space Hugging Face ou le serveur n'ont plus qu'à la tirer :
# l'image est construite une fois, déployée partout.

on:
  push:
    # Seule la branche principale déclenche une construction : les branches de
    # travail ne doivent ni consommer de minutes ni publier des images.
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/image.yml"
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # nécessaire pour publier sur GHCR

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # GHCR exige un nom d'image en minuscules.
      - name: Calculer le nom de l'image
        id: image
        run: echo "nom=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nunya-api" >> "$GITHUB_OUTPUT"

      - name: Préparer Buildx (cache et builds reproductibles)
        uses: docker/setup-buildx-action@v3

      # Connexion au registre avec le jeton fourni par GitHub Actions.
      - name: Se connecter à GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" --username "${{ github.actor }}" --password-stdin

      - name: Calculer les étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.nom }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Mémoire de construction entre deux exécutions : sans elle, les
          # ~700 Mo de torch et du modèle seraient retéléchargés à chaque push.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Oracle Always Free est en ARM : ajouter linux/arm64 ici, ou lancer
          # un second job sur un runner arm64 natif (ubuntu-24.04-arm).
          platforms: linux/amd64
