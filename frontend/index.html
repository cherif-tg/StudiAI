<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nunya — apprendre commence par comprendre</title>
    <meta
      name="description"
      content="Nunya transforme tes documents de cours en réponses fiables, résumés et quiz. Un atelier d'apprentissage documentaire, sobre et ancré."
    />
    <meta name="theme-color" content="#EFEAE1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Work+Sans:wght@300..600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Appliquer le thème avant la première peinture : pas de flash clair/sombre.
      try {
        var prefere = localStorage.getItem("nunya.theme") || "system";
        var systeme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = prefere === "system" ? systeme : prefere;
      } catch (e) {
        /* stockage indisponible : on reste sur le thème clair */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
